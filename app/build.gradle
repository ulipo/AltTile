import java.util.Properties

plugins { id 'com.android.application' }

// Use GitHub Actions secrets, or an ignored local keystore.properties file.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.isFile()) {
    keystorePropertiesFile.withInputStream { stream -> keystoreProperties.load(stream) }
}
def signingValue = { String property, String environment ->
    def value = System.getenv(environment)
    if (value == null || value.trim().isEmpty()) {
        value = keystoreProperties.getProperty(property)
    }
    return value != null && !value.trim().isEmpty() ? value : null
}
def signingStorePath = signingValue('storeFile', 'ALTTILE_STORE_FILE')
def signingStorePassword = signingValue('storePassword', 'ALTTILE_STORE_PASSWORD')
def signingKeyAlias = signingValue('keyAlias', 'ALTTILE_KEY_ALIAS')
def signingKeyPassword = signingValue('keyPassword', 'ALTTILE_KEY_PASSWORD')
def signingConfigured = [
        signingStorePath, signingStorePassword, signingKeyAlias, signingKeyPassword
].every { it != null }

android {
    namespace 'com.example.gpsaltitudetile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.gpsaltitudetile'
        minSdk 26
        targetSdk 35
        versionCode project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 1
        versionName project.hasProperty('versionName') ? project.property('versionName') : '1.0'
    }

    signingConfigs {
        altTileRelease {
            if (signingConfigured) {
                storeFile rootProject.file(signingStorePath)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        // Debug builds use the locally generated Android debug key.
        debug { }
        release {
            minifyEnabled false
            if (signingConfigured) {
                signingConfig signingConfigs.altTileRelease
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}

// Fail closed: never distribute an unsigned CI release.
if (System.getenv('CI') == 'true' && !signingConfigured) {
    throw new GradleException('AltTile release signing is not configured. ' +
            'Set ALTTILE_STORE_FILE, ALTTILE_STORE_PASSWORD, ' +
            'ALTTILE_KEY_ALIAS and ALTTILE_KEY_PASSWORD.')
}
