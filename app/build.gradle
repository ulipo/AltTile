plugins { id 'com.android.application' }

android {
    namespace 'com.example.gpsaltitudetile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.gpsaltitudetile'
        minSdk 26
        targetSdk 35

        // Legge le proprietà passate da GitHub Actions (-PversionCode e -PversionName)
        // Se compilato in locale, usa i valori predefiniti 1 e '1.0'
        versionCode project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 1
        versionName project.hasProperty('versionName') ? project.property('versionName') : '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
