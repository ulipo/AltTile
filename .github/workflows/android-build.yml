name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with dynamic Version and Code
        run: |
          MAJOR=1
          BUILD_NUM=${{ github.run_number }}
          VERSION_NAME="${MAJOR}.${BUILD_NUM}"
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          ./gradlew assembleDebug -PversionCode=${BUILD_NUM} -PversionName="${VERSION_NAME}"

      - name: Rename APK Output
        run: |
          APK_PATH="app/build/outputs/apk/debug"
          mv ${APK_PATH}/app-debug.apk ${APK_PATH}/GPSAltitudeTile_v${{ env.VERSION_NAME }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: GPSAltitudeTile_v${{ env.VERSION_NAME }}
          path: app/build/outputs/apk/debug/GPSAltitudeTile_v${{ env.VERSION_NAME }}.apk
