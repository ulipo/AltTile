name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ALTTILE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ALTTILE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALTTILE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ALTTILE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing ALTTILE_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing ALTTILE_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing ALTTILE_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing ALTTILE_KEY_PASSWORD"; exit 1; }
      - name: Restore private release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ALTTILE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/alttile-release.jks"
          test -s "$RUNNER_TEMP/alttile-release.jks"
          chmod 600 "$RUNNER_TEMP/alttile-release.jks"
      - name: Build signed release APK
        env:
          ALTTILE_STORE_FILE: ${{ runner.temp }}/alttile-release.jks
          ALTTILE_STORE_PASSWORD: ${{ secrets.ALTTILE_STORE_PASSWORD }}
          ALTTILE_KEY_ALIAS: ${{ secrets.ALTTILE_KEY_ALIAS }}
          ALTTILE_KEY_PASSWORD: ${{ secrets.ALTTILE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName=1.${{ github.run_number }}
      - name: Verify APK signing
        run: |
          set -euo pipefail
          SDK_BUILDTOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$SDK_BUILDTOOLS/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Collect release APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/GPSAltitudeTile_v1.${{ github.run_number }}-release.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: GPSAltitudeTile_v1.${{ github.run_number }}-release
          path: dist/*.apk
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/alttile-release.jks"
